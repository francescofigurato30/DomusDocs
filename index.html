<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DomusDocs - Archivio Documentale Immobili</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-sky-600 flex items-center justify-center text-white text-lg font-bold shadow">
          <i class="fa-solid fa-house-circle-check"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight">DomusDocs</h1>
          <p class="text-xs text-sky-200">Archivio Documenti Immobili & Scadenzario</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" onclick="openModal('backup-modal')" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-sky-200 rounded-lg border border-slate-700 flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-database"></i> Backup
        </button>
        <button type="button" onclick="openNewPropModal()" class="px-3.5 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-sm flex items-center gap-1.5 cursor-pointer">
          <i class="fa-solid fa-plus"></i> Nuova Casa
        </button>
      </div>
    </div>
  </header>

  <!-- Container Principale -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">

    <!-- Menu Laterale Sinistro: Tutte le Case -->
    <aside class="w-full md:w-80 flex-shrink-0 flex flex-col gap-4">
      
      <!-- Contatore Scadenze -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 flex items-center justify-between">
          <span>Stato Scadenze Globali</span>
          <i class="fa-regular fa-bell text-slate-400"></i>
        </h2>
        <div class="grid grid-cols-3 gap-2 text-center text-xs">
          <div class="p-2 rounded-xl bg-rose-50 border border-rose-100">
            <span id="badge-scaduti" class="block text-lg font-bold text-rose-700">0</span>
            <span class="text-[10px] text-rose-600 font-medium">Scaduti</span>
          </div>
          <div class="p-2 rounded-xl bg-amber-50 border border-amber-100">
            <span id="badge-in-scadenza" class="block text-lg font-bold text-amber-700">0</span>
            <span class="text-[10px] text-amber-600 font-medium">≤ 30 gg</span>
          </div>
          <div class="p-2 rounded-xl bg-emerald-50 border border-emerald-100">
            <span id="badge-ok" class="block text-lg font-bold text-emerald-700">0</span>
            <span class="text-[10px] text-emerald-600 font-medium">In regola</span>
          </div>
        </div>
      </div>

      <!-- Elenco Menu Case -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Seleziona Immobile</h2>
          <span id="count-properties" class="text-xs font-bold bg-sky-100 text-sky-800 px-2.5 py-0.5 rounded-full">5</span>
        </div>
        <div id="property-menu" class="space-y-2 overflow-y-auto max-h-[520px] custom-scrollbar pr-1">
          <!-- Popolato automaticamente via JS -->
        </div>
      </div>
    </aside>

    <!-- Area Destra: Scheda Casa Selezionata e Documenti -->
    <section class="flex-1 flex flex-col min-w-0" id="main-content">
      <!-- Popolato dinamicamente -->
    </section>

  </main>

  <!-- Modal Aggiungi/Modifica Casa -->
  <div id="property-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="prop-modal-title" class="font-bold text-slate-800">Nuova Casa</h3>
        <button type="button" onclick="closeModal('property-modal')" class="text-slate-400 hover:text-slate-600 cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="prop-form" onsubmit="saveProperty(event)" class="mt-4 space-y-4">
        <input type="hidden" id="prop-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nome Casa *</label>
          <input type="text" id="prop-name" required placeholder="es. Casa Contessa, Casa Mare..." class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Indirizzo Completo</label>
          <input type="text" id="prop-address" placeholder="es. Via..." class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Stato</label>
            <select id="prop-status" class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-sky-500">
              <option value="Uso Personale">Uso Personale</option>
              <option value="Affittato">Affittato</option>
              <option value="Libero">Libero</option>
              <option value="Ristrutturazione">Ristrutturazione</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Catasto</label>
            <input type="text" id="prop-cadastral" placeholder="Fg. ..., Part. ..., Sub. ..." class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-sky-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Note</label>
          <textarea id="prop-notes" rows="2" placeholder="Note utenze, contatori, chiavi..." class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-sky-500"></textarea>
        </div>
        <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal('property-modal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer">Annulla</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold bg-sky-600 hover:bg-sky-500 text-white rounded-xl shadow cursor-pointer">Salva Casa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Aggiungi Documento -->
  <div id="doc-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="font-bold text-slate-800">Carica Scansione Documento</h3>
        <button type="button" onclick="closeModal('doc-modal')" class="text-slate-400 hover:text-slate-600 cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="doc-form" onsubmit="saveDocument(event)" class="mt-4 space-y-4">
        <input type="hidden" id="doc-property-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Sezione / Categoria *</label>
          <select id="doc-category" required class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 bg-white outline-none focus:ring-2 focus:ring-sky-500">
            <option value="Catasto & Proprietà">1. Catasto & Proprietà (Rogito, Visure, Planimetrie)</option>
            <option value="Attestati & Conformità">2. Attestati & Conformità (APE, Impianti, Gas, Agibilità)</option>
            <option value="Contratti & Locazioni">3. Contratti & Locazioni (Contratto, RLI, Verbali Consegna)</option>
            <option value="Fisco & Tasse">4. Fisco & Tasse (F24 IMU, TARI, Modello Unico)</option>
            <option value="Condominio">5. Condominio (Regolamento, Millesimi, Rate, Verbali)</option>
            <option value="Manutenzioni & Spese">6. Manutenzioni & Spese (Bollino Caldaia, Fatture, Garanzie)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Titolo Documento *</label>
          <input type="text" id="doc-title" required placeholder="es. Atto compravendita rogito, Planimetria catastale, APE..." class="w-full text-sm rounded-xl border border-slate-300 px-3 py-2 outline-none focus:ring-2 focus:ring-sky
